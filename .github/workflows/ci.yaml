name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check:web

      - name: Build frontend
        run: npm run build --workspace=@distill/web

      - name: Check backend
        run: npm run check:api

      - name: Build backend
        run: npm run build --workspace=@distill/api

  lean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean