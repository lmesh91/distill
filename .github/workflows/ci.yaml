name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build

  lean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
