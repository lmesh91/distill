name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up and build Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      - name: Run tests
        run: npm run test

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build
