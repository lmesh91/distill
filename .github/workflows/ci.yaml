name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up and build Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      - name: Install Lean sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable submission resource controls
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          sudo systemctl set-property --runtime "user@$(id -u).service" 'Delegate=cpu memory pids'
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm run test

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build
